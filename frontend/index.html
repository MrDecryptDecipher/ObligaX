<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ObligaX — Institutional Clearing, Obligation Management & Settlement Console">
  <meta name="robots" content="noindex, nofollow">

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; script-src 'self'; frame-ancestors 'none';">

  <title>ObligaX | Institutional Clearing &amp; Settlement Console</title>

  <!-- Design Tokens & Stylesheets -->
  <link rel="stylesheet" href="styles.css">

  <!-- Typography: Institutional Precision Stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Prevent FOUC -->
  <style>
    html, body { margin: 0; padding: 0; background-color: #0a0c0f; }
    #app { visibility: hidden; }
    #app.ready { visibility: visible; }
  </style>
</head>

<body>
  <!-- ╔══════════════════════════════════════════════════════════════╗
       ║  OBLIGAX APPLICATION SHELL                                   ║
       ║  Institutional Clearing & Settlement Operations Platform     ║
       ╚══════════════════════════════════════════════════════════════╝ -->

  <div id="app">

    <!-- ── Top Application Header ──────────────────────────────────── -->
    <div id="header-root"></div>

    <!-- ── Application Body: Sidebar + Workspace ──────────────────── -->
    <div class="app-body">

      <!-- ── Left Navigation Sidebar ────────────────────────────── -->
      <div id="sidebar-root"></div>

      <!-- ── Main Workspace Viewport ───────────────────────────── -->
      <main class="app-workspace" role="main" aria-label="ObligaX clearing operations workspace">
        <div id="workspace-content" class="view-content">
          <!-- Views are injected here by the router in main.js -->
        </div>
      </main>

    </div><!-- /.app-body -->

    <!-- ── Detail Drawer (right-side inspector) ───────────────────── -->
    <div id="drawer-root" role="complementary" aria-label="Obligation detail inspector"></div>

    <!-- ── Confirmation & Review Modals ────────────────────────────── -->
    <div id="modal-root" role="dialog" aria-modal="true"></div>

    <!-- ── Toast Notification Stack ────────────────────────────────── -->
    <div id="notifications-root" role="status" aria-live="polite" aria-atomic="false"></div>

    <!-- ── Command Palette (⌘K / Ctrl+K) ────────────────────────── -->
    <div id="command-palette-root" role="dialog" aria-label="Command palette" aria-modal="true"></div>

  </div><!-- /#app -->

  <!-- ── Application Entry (ES Module, no bundler required) ───────── -->
  <script type="module" src="src/main.js"></script>

  <!-- ── Show app shell once JS module has run ────────────────────── -->
  <script>
    // Progressive reveal: make the app visible once the module loads
    document.addEventListener('DOMContentLoaded', () => {
      // Small delay to allow first render pass before revealing
      setTimeout(() => {
        document.getElementById('app').classList.add('ready');
      }, 80);
    });
  </script>
</body>
</html>

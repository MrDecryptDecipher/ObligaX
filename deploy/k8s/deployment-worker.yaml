apiVersion: apps/v1
kind: Deployment
metadata:
  name: obligax-worker
  namespace: obligax
  labels:
    app.kubernetes.io/name: obligax-worker
    app.kubernetes.io/component: background-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: obligax-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obligax-worker
        app.kubernetes.io/component: background-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/obligax/obligax-worker:v0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: obligax-config
            - secretRef:
                name: obligax-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}

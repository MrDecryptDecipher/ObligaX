apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obligax-api-netpol
  namespace: obligax
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: obligax-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from ingress controller / API gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    # Allow Prometheus monitoring scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow egress to PostgreSQL
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5432
    # Allow egress to Canton Network Participants
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: canton-network
      ports:
        - protocol: TCP
          port: 5011
        - protocol: TCP
          port: 5012
    # Allow egress to Redis cluster
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow egress to Kafka brokers
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53

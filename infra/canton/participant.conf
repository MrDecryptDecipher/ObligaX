canton {
  participants {
    participant1 {
      storage {
        type = memory
      }
      admin-api {
        address = "0.0.0.0"
        port = 5012
        tls {
          cert-chain-file = "infra/canton/certificates/participant1.crt"
          private-key-file = "infra/canton/certificates/participant1.key"
          trust-collection-file = "infra/canton/certificates/ca.crt"
          minimum-server-protocol-version = "TLSv1.3"
        }
      }
      ledger-api {
        address = "0.0.0.0"
        port = 5011
        tls {
          cert-chain-file = "infra/canton/certificates/participant1.crt"
          private-key-file = "infra/canton/certificates/participant1.key"
          trust-collection-file = "infra/canton/certificates/ca.crt"
          minimum-server-protocol-version = "TLSv1.3"
        }
        auth-services = [{
          type = "jwt-jwks"
          url = "https://idp.obligax.network/oauth2/v1/keys"
        }]
      }
    }

    participant2 {
      storage {
        type = memory
      }
      admin-api {
        address = "0.0.0.0"
        port = 5022
      }
      ledger-api {
        address = "0.0.0.0"
        port = 5021
      }
    }

    participant3 {
      storage {
        type = memory
      }
      admin-api {
        address = "0.0.0.0"
        port = 5032
      }
      ledger-api {
        address = "0.0.0.0"
        port = 5031
      }
    }
  }
}
